name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (e.g., 2.5.1) - leave empty to use _version.py'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      draft:
        description: 'Create as draft release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./MCBE-AI-Agent-addon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ./MCBE-AI-Agent-addon/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Determine version
        id: get_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            # _version.py 在仓库根，defaults.run.working-directory 是 addon 目录，需先切回
            cd "$GITHUB_WORKSPACE"
            VERSION=$(python -c "from _version import __version__; print(__version__)")
          fi
          # 写入 GITHUB_OUTPUT 前做严格校验，防止输入注入
          if [[ "$VERSION" == *$'\n'* ]] || [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "错误: 版本号格式无效: $VERSION（应为 MAJOR.MINOR.PATCH）" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Sync addon version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -n "$INPUT_VERSION" ]; then
            # 手动 override：将 addon 同步到 release 版本，保证 .mcaddon 内 manifest 与 release 一致
            bash scripts/sync-version.sh --addon-only "${{ steps.get_version.outputs.version }}"
          else
            # 默认路径：门禁校验，确保 manifest 与 _version.py 一致
            bash scripts/sync-version.sh --check
          fi

      - name: Build addon (production)
        run: pnpm build:production
        env:
          PROJECT_NAME: MCBE-AI-Agent

      - name: Package mcaddon (production)
        run: pnpm mcaddon:production
        env:
          PROJECT_NAME: MCBE-AI-Agent

      - name: Rename mcaddon with version
        run: |
          mkdir -p dist/release
          cp "dist/packages/MCBE-AI-Agent.mcaddon" "dist/release/MCBE-AI-Agent-v${{ steps.get_version.outputs.version }}.mcaddon"

      - name: Generate changelog
        id: changelog
        run: |
          # Get the last tag or use empty if none exists
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -n "$LAST_TAG" ]; then
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            echo "## Changes since $LAST_TAG" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            # 统计全仓库提交（与手工维护的 CHANGELOG.md 分工，release notes 自动生成）
            git log --pretty=format:"- %s (%h)" "$LAST_TAG"..HEAD >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            echo "## Initial Release" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            git log --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Archive repo source (release asset)
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist/release
          # 以工作树当前状态归档（Sync addon version 可能已改动未提交的 manifest），
          # 保证 src.zip 与构建出的 .mcaddon 版本一致；git archive 只打包已跟踪文件，
          # 天然排除 .git、node_modules、data/、logs/、.worktrees/ 等
          git add -A
          TREE=$(git write-tree)
          git archive --format=zip --prefix=MCBE-AI-Agent-${{ steps.get_version.outputs.version }}/ \
            -o dist/release/MCBE-AI-Agent-${{ steps.get_version.outputs.version }}-src.zip "$TREE"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: MCBE AI Agent v${{ steps.get_version.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.changes }}

            ## 安装说明
            1. 下载 `.mcaddon` 文件。
            2. 双击文件将其导入到 Minecraft Bedrock 版中。
            3. 在世界设置中启用行为包和资源包。
            4. 在**实验性玩法中启用测试版 API**。

            ## 文件
            - `MCBE-AI-Agent-v${{ steps.get_version.outputs.version }}.mcaddon` - 完整 Addon 包
            - `MCBE-AI-Agent-${{ steps.get_version.outputs.version }}-src.zip` - 仓库源码归档
          files: |
            MCBE-AI-Agent-addon/dist/release/*.mcaddon
            dist/release/*-src.zip
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-v${{ steps.get_version.outputs.version }}
          path: |
            MCBE-AI-Agent-addon/dist/release/*.mcaddon
            dist/release/*-src.zip
          retention-days: 90
